<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U TIAM — Point de Vente</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg-main:     #0d0d0d;
      --bg-surface:  #161616;
      --bg-elevated: #222222;
      --border:      #2c2c2c;
      --text-primary:   #ffffff;
      --text-secondary: #a0a0a0;
      --text-muted:     #555555;
      --accent:        #d4af37;
      --accent-hover:  #e5c158;
      --accent-active: #b89326;
      --success: #2ecc71;
      --warning: #f1c40f;
      --danger:  #e74c3c;
      --info:    #3498db;
    }
 
    * { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      background: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }
 
    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 18px; border-radius: 8px; font-weight: 600;
      font-size: 13px; cursor: pointer; border: none; transition: all 0.15s;
    }
    .btn-primary  { background: var(--accent); color: #000; }
    .btn-primary:hover  { background: var(--accent-hover); }
    .btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #333; }
    .btn-danger   { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 5px 12px; font-size: 12px; }
    .btn-danger:hover   { background: #2C1414; }
    .btn-edit     { background: transparent; color: var(--accent); border: 1px solid #3a3000; padding: 5px 12px; font-size: 12px; }
    .btn-edit:hover     { background: #2a2000; }
    .btn-sm { padding: 6px 14px; font-size: 12px; }
 
    /* ── INPUTS ── */
    .input {
      background: var(--bg-elevated); border: 1px solid var(--border);
      color: var(--text-primary); border-radius: 8px;
      padding: 10px 14px; width: 100%; font-size: 14px;
      transition: border-color 0.15s;
    }
    .input:focus { outline: none; border-color: var(--accent); }
    .input::placeholder { color: var(--text-muted); }
 
    select.input option { background: var(--bg-elevated); }
 
    /* ── CARD ── */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
    }
 
    /* ── BADGES ── */
    .badge {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
    }
    .badge-success { background: #102A18; color: var(--success); }
    .badge-warning { background: #2A1F05; color: var(--warning); }
    .badge-danger  { background: #2C1414; color: var(--danger);  }
    .badge-info    { background: #0D1F2D; color: var(--info);    }
 
    /* ── LAYOUT ── */
    #app-screen { display: flex; min-height: 100vh; position: relative; }
 
    /* ── SIDEBAR ── */
    aside {
      width: 220px; flex-shrink: 0;
      background: var(--bg-main);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      transition: transform 0.25s ease;
    }
    .sidebar-logo {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: var(--accent); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-title { font-weight: 800; font-size: 16px; color: var(--text-primary); }
    .logo-sub   { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
 
    nav { flex: 1; padding: 12px 8px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 8px;
      color: var(--text-secondary); font-weight: 500;
      cursor: pointer; transition: all 0.15s;
      margin-bottom: 2px; width: 100%; text-align: left;
      background: none; border: none;
      border-left: 3px solid transparent;
    }
    .nav-item:hover { background: #1a1a1a; color: var(--text-primary); }
    .nav-item.active { background: #1a1a1a; color: var(--accent); border-left-color: var(--accent); }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
 
    .sidebar-footer {
      padding: 12px 8px;
      border-top: 1px solid var(--border);
    }
    .user-info {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; margin-bottom: 4px;
    }
    .user-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: #2a2000; border: 1px solid var(--accent);
      color: var(--accent); font-weight: 700; font-size: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .user-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .user-role { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; }
    .btn-logout {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 8px;
      color: var(--danger); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: background 0.15s;
      background: none; border: none; width: 100%;
    }
    .btn-logout:hover { background: #1a0a0a; }
    .btn-logout svg { width: 15px; height: 15px; }
 
    /* ── MAIN ── */
    main {
      flex: 1; overflow-y: auto;
      background: var(--bg-main);
      min-width: 0;
    }
 
    /* ── TOPBAR ── */
    .topbar {
      height: 56px; background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 24px; gap: 12px;
      position: sticky; top: 0; z-index: 10;
    }
    .topbar-title { font-size: 16px; font-weight: 700; flex: 1; }
    .topbar-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 6px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      font-size: 12px; color: var(--text-secondary);
    }
    .dot-green { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
 
    /* ── HAMBURGER ── */
    .btn-hamburger {
      display: none;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-primary);
      width: 36px; height: 36px;
      border-radius: 8px;
      align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-hamburger:hover { background: #333; }
 
    /* ── OVERLAY (mobile) ── */
    .sidebar-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 99;
    }
 
    /* ── PAGE CONTENT ── */
    .page { padding: 24px; }
 
    /* ── LOGIN ── */
    #login-screen {
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center;
      background: var(--bg-main);
      background-image: radial-gradient(ellipse at 20% 50%, #1a1500 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 50%, #0a1a0a 0%, transparent 60%);
      padding: 16px;
    }
    .login-card {
      width: 100%; max-width: 400px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 40px;
    }
    .login-logo {
      width: 56px; height: 56px;
      background: var(--accent); border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .login-logo svg { width: 28px; height: 28px; color: #000; }
    .login-title { text-align: center; font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .login-sub   { text-align: center; color: var(--text-secondary); font-size: 13px; margin-bottom: 28px; }
    .login-fields { display: flex; flex-direction: column; gap: 12px; }
    .login-btn {
      width: 100%; background: var(--accent); color: #000;
      font-weight: 700; font-size: 15px;
      padding: 13px; border-radius: 10px; border: none;
      cursor: pointer; margin-top: 4px;
      transition: background 0.15s;
    }
    .login-btn:hover { background: var(--accent-hover); }
    .login-error { color: var(--danger); font-size: 13px; text-align: center; margin-top: 8px; }
 
    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 16px;
    }
    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%; max-width: 640px;
      max-height: 90vh; overflow-y: auto;
      padding: 28px;
    }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 24px; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
 
    /* ── FORM GRID ── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .form-error { color: var(--danger); font-size: 13px; margin-top: 16px; }
 
    /* ── TABLE ── */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      text-align: left; font-size: 11px; font-weight: 600;
      color: var(--text-secondary); text-transform: uppercase;
      letter-spacing: 0.08em; padding: 0 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    .data-table td { padding: 14px 16px; border-bottom: 1px solid #1e1e1e; vertical-align: middle; }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: #1a1a1a; }
    .data-table tr { transition: background 0.1s; }
 
    /* ── ALERT ── */
    .alert-danger {
      background: #2C1414; border: 1px solid #5a2020;
      border-radius: 10px; padding: 12px 16px;
      color: var(--danger); font-size: 13px;
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px;
    }
 
    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-main); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
 
    .hidden { display: none !important; }
 
    /* ──────────────────────────────────────────────────
       MOBILE RESPONSIVE (≤ 768px)
       ────────────────────────────────────────────────── */
    @media (max-width: 768px) {
 
      /* Sidebar : devient un drawer en overlay */
      aside {
        position: fixed; top: 0; left: 0; bottom: 0;
        width: 240px; z-index: 100;
        transform: translateX(-100%);
        box-shadow: 4px 0 20px rgba(0,0,0,0.5);
      }
      aside.open { transform: translateX(0); }
 
      .sidebar-overlay.open { display: block; }
 
      /* Bouton hamburger visible */
      .btn-hamburger { display: inline-flex; }
 
      /* Topbar plus compacte */
      .topbar { padding: 0 12px; gap: 8px; }
      .topbar-title { font-size: 15px; }
 
      /* Cacher certains badges sur petit écran */
      .topbar-badge-hide-mobile { display: none; }
 
      /* Page padding réduit */
      .page { padding: 12px; }
 
      /* Modal plein écran sur mobile */
      .modal-overlay { padding: 0; align-items: stretch; }
      .modal-box {
        max-height: 100vh; max-width: 100%;
        border-radius: 0; padding: 20px 16px;
      }
 
      /* Form grid en colonne unique */
      .form-grid { grid-template-columns: 1fr; }
 
      /* Login moins de padding */
      .login-card { padding: 28px 24px; }
 
      /* Table : police plus petite + padding réduit */
      .data-table th { padding: 0 10px 10px; font-size: 10px; }
      .data-table td { padding: 10px; font-size: 13px; }
    }
 
    /* Très petit écran (≤ 380px) */
    @media (max-width: 380px) {
      .topbar-badge { padding: 4px 8px; font-size: 11px; }
    }
  </style>
</head>
<body>
 
<!-- ── LOGIN ── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
      </svg>
    </div>
    <div class="login-title">U TIAM</div>
    <div class="login-sub">Point de Vente — KANIENE CONSULT LAB</div>
    <div class="login-fields">
      <input id="login-email"    type="email"    placeholder="Email"         class="input" />
      <input id="login-password" type="password" placeholder="Mot de passe"  class="input"
             onkeydown="if(event.key==='Enter') authLogin()" />
      <button class="login-btn" onclick="authLogin()">Se connecter</button>
      <div id="login-error" class="login-error hidden"></div>
    </div>
  </div>
</div>
 
<!-- ── APP ── -->
<div id="app-screen" class="hidden" style="display:none">
 
  <!-- Overlay (mobile) -->
  <div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>
 
  <aside id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="#000" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
        </svg>
      </div>
      <div>
        <div class="logo-title">U TIAM</div>
        <div class="logo-sub">Point de Vente</div>
      </div>
    </div>
    <nav id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">U</div>
        <div>
          <div class="user-name" id="user-name">—</div>
          <div class="user-role" id="user-role">—</div>
        </div>
      </div>
      <button class="btn-logout" onclick="authLogout()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        Déconnexion
      </button>
    </div>
  </aside>
 
  <main>
    <div class="topbar">
      <button class="btn-hamburger" onclick="openSidebar()" title="Menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <div class="topbar-title" id="topbar-title">—</div>
      <div class="topbar-badge topbar-badge-hide-mobile">
        <div class="dot-green"></div>
        Système Connecté
      </div>
      <div class="topbar-badge">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span id="topbar-user">—</span>
      </div>
    </div>
    <div id="main-content" class="page"></div>
  </main>
</div>
 
<!-- ── CORE ── -->
<script src="/core/api.js"></script>
<script src="/core/auth.js"></script>
<script src="/core/scanner.js"></script>
 
<!-- ── MODULES ── -->
<script src="/modules/products.js"></script>
<script src="/modules/pos.js"></script>
<script src="/modules/stock.js"></script>
<script src="/modules/inventory.js"></script>
<script src="/modules/clients.js"></script>
<script src="/modules/reports.js"></script>
<script src="/modules/users.js"></script>
 
<!-- ── NAVIGATION + SIDEBAR MOBILE ── -->
<script>
const TABS = [
  { id: 'pos',       label: 'Caisse',        icon: 'shopping-cart', roles: ['admin','gerant','caissier'] },
  { id: 'products',  label: 'Produits',      icon: 'package',       roles: ['admin','gerant'] },
  { id: 'stock',     label: 'Stock',         icon: 'layers',        roles: ['admin','gerant'] },
  { id: 'inventory', label: 'Inventaire',    icon: 'clipboard-list',roles: ['admin','gerant'] },
  { id: 'clients',   label: 'Clients',       icon: 'users',         roles: ['admin','gerant','caissier'] },
  { id: 'reports',   label: 'Rapports',      icon: 'bar-chart-2',   roles: ['admin','gerant'] },
  { id: 'users',     label: 'Utilisateurs',  icon: 'user-cog',      roles: ['admin'] },
];
 
function buildNav() {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = TABS
    .filter(t => t.roles.includes(currentUser.role))
    .map(t => `
      <button onclick="renderTab('${t.id}')" id="tab-${t.id}" class="nav-item">
        <i data-lucide="${t.icon}"></i>
        ${t.label}
      </button>`).join('');
  lucide.createIcons();
}
 
function renderTab(tab) {
  // Arrete le scanner si on quitte la page Produits
  if (typeof scannerStopListening === 'function') scannerStopListening();
 
  TABS.forEach(t => {
    const el = document.getElementById('tab-' + t.id);
    if (el) el.className = 'nav-item' + (t.id === tab ? ' active' : '');
  });
  const label = TABS.find(t => t.id === tab)?.label || '';
  document.getElementById('topbar-title').textContent = label;
 
  // Ferme la sidebar sur mobile apres choix
  closeSidebar();
 
  const main = document.getElementById('main-content');
  if      (tab === 'pos')       renderPOS(main);
  else if (tab === 'products')  renderProducts(main);
  else if (tab === 'stock')     renderStock(main);
  else if (tab === 'inventory') renderInventory(main);
  else if (tab === 'clients')   renderClients(main);
  else if (tab === 'reports')   renderReports(main);
  else if (tab === 'users')     renderUsers(main);
}
 
// ── Sidebar mobile ──
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-overlay').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}
</script>
</body>
</html>
